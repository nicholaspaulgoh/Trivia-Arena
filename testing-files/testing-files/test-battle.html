<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Battle Logic Test Harness</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    .fail { color: #f55; }
    .pass { color: #5f5; }
    button { margin: 4px; padding: 8px 12px; }
    #log { white-space: pre-wrap; border: 1px solid #333; padding: 10px; margin-top: 10px; max-height: 500px; overflow-y: auto; }
  </style>
</head>
<body>
  <h2>Battle Logic Test Harness (no UI, console-driven)</h2>
  <p>Open DevTools console too — everything here also logs there.</p>

  <button onclick="resetState()">Reset State</button>
  <button onclick="testFullCorrectTurn()">Test: Full Correct Turn</button>
  <button onclick="testWrongThenStealSuccess()">Test: Wrong → Steal Success</button>
  <button onclick="testWrongThenStealFail()">Test: Wrong → Steal Fail</button>
  <button onclick="testCritProbability()">Test: Crit % Distribution (1000 rolls)</button>
  <button onclick="printState()">Print Current State</button>

  <div id="log"></div>

  <!-- LOAD ORDER MATTERS: streak.js -> steal.js -> battle.js -->
  <script src="js/streak.js"></script>
  <script src="js/steal.js"></script>
  <script src="js/battle.js"></script>

  <script>
    // ---- Stubs for functions battle.html/Task 19 will eventually provide ----
    function logEvent(msg, type) { print(`[EVENT:${type}] ${msg}`); }
    function updateStreakDisplay(playerKey) { /* no-op for now */ }
    function updateBonusDisplay(playerKey) { /* no-op for now */ }

    const logEl = document.getElementById('log');
    function print(msg, cls) {
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = msg;
      logEl.appendChild(line);
      console.log(msg);
    }
    function assert(condition, label) {
      print((condition ? 'PASS ' : 'FAIL ') + label, condition ? 'pass' : 'fail');
    }

    function resetState() {
      battleState.currentTurn = 'player1';
      battleState.player1 = { name: 'Alex', hp: 200, maxHP: 200, streak: 0, critPending: false, storedBonus: 0, moves: [] };
      battleState.player2 = { name: 'Sam', hp: 200, maxHP: 200, streak: 0, critPending: false, storedBonus: 0, moves: [] };
      print('--- state reset ---');
    }

    function printState() { print(JSON.stringify(battleState, null, 2)); }

    const TEST_MOVE_NORMAL = { name: 'Tackle', type: 'normal', power: 50 };
    const TEST_MOVE_RISKY  = { name: 'Overload', type: 'electric', power: 110 };

    function withMockedRandom(value, fn) {
      const original = Math.random;
      Math.random = () => value;
      try { fn(); } finally { Math.random = original; }
    }

    function testFullCorrectTurn() {
      resetState();
      const machine = new BattleStateMachine(battleState, {
        onStateChange: (s) => print('  state -> ' + s),
        onDamageDealt: (atk, def, dmg, crit, bonus) =>
          print(`  DAMAGE: ${atk} hit ${def} for ${dmg} (crit=${crit}, bonus=${bonus})`)
      });
      const hpBefore = battleState.player2.hp;
      machine.selectMove(TEST_MOVE_NORMAL);
      withMockedRandom(0.99, () => machine.resolveQuestion(true));
      assert(battleState.player2.hp < hpBefore, 'player2 lost HP');
      assert(battleState.currentTurn === 'player2', 'turn passed to player2');
      assert(battleState.player1.streak === 1, 'player1 streak incremented to 1');
    }

    function testWrongThenStealSuccess() {
      resetState();
      const machine = new BattleStateMachine(battleState, {
        onStateChange: (s) => print('  state -> ' + s),
        onDamageDealt: (atk, def, dmg, crit, bonus) =>
          print(`  DAMAGE: ${atk} hit ${def} for ${dmg} (crit=${crit}, bonus=${bonus})`)
      });
      const hpBefore = battleState.player1.hp;
      machine.selectMove(TEST_MOVE_NORMAL);
      machine.resolveQuestion(false);
      assert(battleState.player1.streak === 0, 'player1 streak reset after wrong answer');
      assert(battleState.player1.critPending === false, 'critPending cleared after wrong answer');
      machine.resolveStealAttempt(true);
      assert(battleState.player2.storedBonus === 0.10, 'player2 banked +10% bonus');
      machine.stealerSelectMove(TEST_MOVE_NORMAL);
      assert(battleState.player1.hp < hpBefore, 'player1 lost HP from the steal-attack');
      assert(battleState.player2.storedBonus === 0, 'bonus consumed after the steal-attack');
      assert(battleState.currentTurn === 'player1', 'turn goes BACK to player1 after a stolen turn');
    }

    function testWrongThenStealFail() {
      resetState();
      const machine = new BattleStateMachine(battleState, { onStateChange: (s) => print('  state -> ' + s) });
      const p1HpBefore = battleState.player1.hp;
      const p2HpBefore = battleState.player2.hp;
      machine.selectMove(TEST_MOVE_NORMAL);
      machine.resolveQuestion(false);
      machine.resolveStealAttempt(false);
      assert(battleState.player1.hp === p1HpBefore, 'nobody damaged player1');
      assert(battleState.player2.hp === p2HpBefore, 'nobody damaged player2');
      assert(battleState.currentTurn === 'player2', "turn passes to player2's own normal turn");
    }

    function testCritProbability() {
      resetState();
      let crits = 0;
      const trials = 1000;
      for (let i = 0; i < trials; i++) {
        battleState.player1.streak = 0;
        battleState.player1.critPending = false;
        onCorrectAnswer('player1');
        if (battleState.player1.critPending) crits++;
      }
      const rate = (crits / trials * 100).toFixed(1);
      print(`crit rate at streak=0: ${rate}% (expect ~10%)`);
      assert(rate > 5 && rate < 15, 'crit rate within range of 10% target');
    }
  </script>
</body>
</html>
