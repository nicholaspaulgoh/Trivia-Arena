<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Streak Counter Test</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 20px;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #534AB7;
      letter-spacing: 2px;
    }

    /* ── Fighter cards ── */
    .fighters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }

    .fighter-card {
      background: #16213e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.3s;
    }

    .fighter-card.active-turn {
      border-color: #534AB7;
      box-shadow: 0 0 20px rgba(83,74,183,0.2);
    }

    .fighter-name {
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .turn-indicator {
      font-size: 10px;
      background: #534AB7;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      display: none;
    }

    .turn-indicator.visible { display: inline-block; }

    /* ── HP bar ── */
    .hp-track {
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .hp-fill {
      height: 100%;
      background: #1D9E75;
      border-radius: 4px;
      transition: width 0.4s ease-out;
    }

    /* ── Streak display ── */
    .streak-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .streak-label {
      font-size: 11px;
      color: #888;
      min-width: 50px;
    }

    /* Individual streak pip dots */
    .streak-pips {
      display: flex;
      gap: 5px;
    }

    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #333;
      background: transparent;
      transition: all 0.2s;
    }

    .pip.filled {
      background: #534AB7;
      border-color: #534AB7;
      box-shadow: 0 0 6px rgba(83,74,183,0.6);
    }

    /* Pip 2 pulses — crit incoming warning */
    .pip.warning {
      background: #BA7517;
      border-color: #BA7517;
      animation: pipPulse 0.6s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(186,117,23,0.7);
    }

    @keyframes pipPulse {
      0%,100% { transform: scale(1);    }
      50%     { transform: scale(1.25); }
    }

    /* Streak number badge */
    .streak-badge {
      font-size: 11px;
      font-weight: bold;
      min-width: 20px;
      color: #534AB7;
    }

    /* CRIT READY badge */
    .crit-badge {
      display: none;
      font-size: 9px;
      font-weight: bold;
      font-family: 'Press Start 2P', monospace;
      padding: 3px 8px;
      border-radius: 20px;
      background: #E24B4A;
      color: white;
      letter-spacing: 1px;
      animation: critFlash 0.5s ease-in-out infinite alternate;
    }

    .crit-badge.visible { display: inline-block; }

    @keyframes critFlash {
      from { opacity: 1;   transform: scale(1);    }
      to   { opacity: 0.7; transform: scale(1.05); }
    }

    /* Steal bonus indicator */
    .bonus-badge {
      display: none;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #BA751722;
      color: #BA7517;
      border: 1px solid #BA7517;
    }

    .bonus-badge.visible { display: inline-block; }

    /* ── Event log ── */
    .event-log {
      width: 100%;
      max-width: 640px;
      background: #16213e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-entry {
      font-size: 12px;
      padding: 2px 0;
      border-bottom: 1px solid #1a1a2e;
    }

    .log-entry.correct { color: #1D9E75; }
    .log-entry.wrong   { color: #E24B4A; }
    .log-entry.crit    { color: #FFD700; font-weight: bold; }
    .log-entry.steal   { color: #BA7517; }
    .log-entry.system  { color: #555; }

    /* ── Controls ── */
    .controls {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ctrl-label {
      font-size: 11px;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 14px;
      border: 2px solid;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      background: transparent;
      font-weight: bold;
      transition: transform 0.1s, filter 0.1s;
    }

    .btn:hover  { filter: brightness(1.3); }
    .btn:active { transform: scale(0.95); }

    .c-correct { border-color: #1D9E75; color: #1D9E75; }
    .c-wrong   { border-color: #E24B4A; color: #E24B4A; }
    .c-steal-s { border-color: #BA7517; color: #BA7517; }
    .c-steal-f { border-color: #555;    color: #888;    }
    .c-switch  { border-color: #534AB7; color: #534AB7; }
    .c-reset   { border-color: #333;    color: #555;    font-size: 11px; }

    /* Damage flash */
    @keyframes dmgFlash {
      0%   { background: rgba(229,75,74,0.4); }
      100% { background: transparent; }
    }

    .fighter-card.taking-damage {
      animation: dmgFlash 0.4s ease-out;
    }

    @keyframes critHit {
      0%   { background: rgba(255,215,0,0.3); }
      100% { background: transparent; }
    }

    .fighter-card.crit-damage {
      animation: critHit 0.5s ease-out;
    }

  </style>
</head>
<body>

<h1>STREAK SYSTEM TEST</h1>

<!-- Fighter cards -->
<div class="fighters">

  <!-- Player 1 -->
  <div class="fighter-card active-turn" id="card-player1">
    <div class="fighter-name">
      Player 1
      <span class="turn-indicator visible" id="turn-player1">TURN</span>
    </div>
    <div class="hp-track">
      <div class="hp-fill" id="hp-player1" style="width:100%"></div>
    </div>
    <div style="font-size:11px;color:#888" id="hptext-player1">200 / 200</div>

    <div class="streak-row">
      <span class="streak-label">Streak</span>
      <div class="streak-pips" id="pips-player1">
        <div class="pip" id="pip-player1-0"></div>
        <div class="pip" id="pip-player1-1"></div>
        <div class="pip" id="pip-player1-2"></div>
      </div>
      <span class="streak-badge" id="streak-player1">0</span>
      <span class="crit-badge" id="crit-player1">⚡ CRIT!</span>
    </div>

    <div>
      <span class="bonus-badge" id="bonus-player1">+10% bonus</span>
    </div>
  </div>

  <!-- Player 2 -->
  <div class="fighter-card" id="card-player2">
    <div class="fighter-name">
      Player 2
      <span class="turn-indicator" id="turn-player2">TURN</span>
    </div>
    <div class="hp-track">
      <div class="hp-fill" id="hp-player2" style="width:100%"></div>
    </div>
    <div style="font-size:11px;color:#888" id="hptext-player2">200 / 200</div>

    <div class="streak-row">
      <span class="streak-label">Streak</span>
      <div class="streak-pips" id="pips-player2">
        <div class="pip" id="pip-player2-0"></div>
        <div class="pip" id="pip-player2-1"></div>
        <div class="pip" id="pip-player2-2"></div>
      </div>
      <span class="streak-badge" id="streak-player2">0</span>
      <span class="crit-badge" id="crit-player2">⚡ CRIT!</span>
    </div>

    <div>
      <span class="bonus-badge" id="bonus-player2">+10% bonus</span>
    </div>
  </div>

</div>

<!-- Event log -->
<div class="event-log" id="eventLog">
  <div class="log-entry system">— Game start — Player 1's turn —</div>
</div>

<!-- Controls -->
<div class="controls">

  <div class="ctrl-label">Active player's question result:</div>
  <div class="btn-row">
    <button class="btn c-correct"
      onclick="simCorrect()">✓ Correct Answer</button>
    <button class="btn c-wrong"
      onclick="simWrong()">✗ Wrong / Timeout</button>
  </div>

  <div class="ctrl-label">Steal phase (opponent responds):</div>
  <div class="btn-row">
    <button class="btn c-steal-s"
      onclick="simSteal(true)">✓ Steal Success (+10%)</button>
    <button class="btn c-steal-f"
      onclick="simSteal(false)">✗ Steal Failed</button>
  </div>

  <div class="ctrl-label">Battle controls:</div>
  <div class="btn-row">
    <button class="btn c-switch"
      onclick="switchTurn()">↔ Switch Turn</button>
    <button class="btn c-reset"
      onclick="resetAll()">↺ Reset everything</button>
  </div>

</div>

<script>
// ── Battle state ──────────────────────────────────────────────
const battleState = {
  currentTurn: 'player1',
  player1: { hp:200, maxHP:200, streak:0, critPending:false, storedBonus:0 },
  player2: { hp:200, maxHP:200, streak:0, critPending:false, storedBonus:0 }
}

// Damage per correct answer (for demonstration)
const BASE_DAMAGE = 30

// ── Get opponent key ──────────────────────────────────────────
function getOpponent(playerKey) {
  return playerKey === 'player1' ? 'player2' : 'player1'
}

// ── SIMULATE: active player answers correctly ─────────────────
function simCorrect() {
  const active   = battleState.currentTurn
  const defender = getOpponent(active)
  const player   = battleState[active]

  player.streak++
  addLog(active + ' answered correctly! Streak: ' + player.streak, 'correct')

  if (player.streak >= 3) {
    // Streak hits 3 — bank the crit
    player.critPending = true
    player.streak = 0
    addLog('⚡ ' + active + ' CRIT READY! (3 in a row)', 'crit')
  }

  // Deal damage — apply crit and steal bonus
  dealDamage(active, defender)

  updateAllDisplays()
}

// ── SIMULATE: active player answers wrong / times out ─────────
function simWrong() {
  const active = battleState.currentTurn
  const player = battleState[active]

  player.streak = 0
  addLog(active + ' answered wrong — streak reset to 0', 'wrong')

  updateAllDisplays()
  addLog('Steal phase starting... (click steal button)', 'system')
}

// ── SIMULATE: steal attempt ────────────────────────────────────
function simSteal(success) {
  const active   = battleState.currentTurn
  const opponent = getOpponent(active)
  // Note: active player's streak is NEVER touched here

  if (success) {
    battleState[opponent].storedBonus += 0.10
    addLog(opponent + ' stole! +10% bonus stored for next attack', 'steal')
    addLog('(' + active + '\'s streak unchanged — still 0)', 'system')
  } else {
    addLog(opponent + ' steal failed — no damage this turn', 'system')
    addLog('(' + active + '\'s streak unchanged)', 'system')
  }

  updateAllDisplays()
}

// ── Deal damage (applies crit + steal bonus) ──────────────────
function dealDamage(attacker, defender) {
  const attackerState = battleState[attacker]
  const defenderState = battleState[defender]

  let damage = BASE_DAMAGE
  let isCrit = false

  // Apply crit multiplier if pending
  if (attackerState.critPending) {
    damage = Math.floor(damage * 1.5)
    attackerState.critPending = false
    isCrit = true
  }

  // Apply steal bonus if stored
  if (attackerState.storedBonus > 0) {
    damage = Math.floor(damage * (1 + attackerState.storedBonus))
    attackerState.storedBonus = 0
  }

  defenderState.hp = Math.max(0, defenderState.hp - damage)

  if (isCrit) {
    addLog('💥 CRITICAL HIT! ' + damage + ' damage to ' + defender, 'crit')
    flashCard(defender, 'crit-damage')
  } else {
    addLog(attacker + ' dealt ' + damage + ' damage to ' + defender, 'correct')
    flashCard(defender, 'taking-damage')
  }

  if (defenderState.hp <= 0) {
    addLog('K.O.! ' + attacker + ' wins!', 'crit')
  }
}

// ── Switch whose turn it is ────────────────────────────────────
function switchTurn() {
  battleState.currentTurn =
    battleState.currentTurn === 'player1' ? 'player2' : 'player1'

  addLog('— Turn switches to ' + battleState.currentTurn + ' —', 'system')
  updateTurnIndicators()
}

// ── Update all displays ───────────────────────────────────────
function updateAllDisplays() {
  updateStreakDisplay('player1')
  updateStreakDisplay('player2')
  updateHPDisplay('player1')
  updateHPDisplay('player2')
  updateTurnIndicators()
}

// ── Update streak display for one player ─────────────────────
function updateStreakDisplay(playerKey) {
  const player = battleState[playerKey]

  // Update streak number badge
  document.getElementById('streak-' + playerKey).textContent = player.streak

  // Update pip dots
  for (let i = 0; i < 3; i++) {
    const pip = document.getElementById('pip-' + playerKey + '-' + i)
    pip.classList.remove('filled', 'warning')

    if (i < player.streak) {
      // Dot is filled
      if (player.streak === 2 && i === 1) {
        // At streak 2, second pip pulses amber as a warning
        pip.classList.add('warning')
      } else {
        pip.classList.add('filled')
      }
    }
  }

  // Show / hide CRIT READY badge
  const critBadge = document.getElementById('crit-' + playerKey)
  if (player.critPending) {
    critBadge.classList.add('visible')
  } else {
    critBadge.classList.remove('visible')
  }

  // Show / hide steal bonus badge
  const bonusBadge = document.getElementById('bonus-' + playerKey)
  if (player.storedBonus > 0) {
    bonusBadge.textContent = '+' + Math.round(player.storedBonus * 100) + '% bonus'
    bonusBadge.classList.add('visible')
  } else {
    bonusBadge.classList.remove('visible')
  }
}

// ── Update HP display ─────────────────────────────────────────
function updateHPDisplay(playerKey) {
  const player = battleState[playerKey]
  const pct    = (player.hp / player.maxHP) * 100
  const fill   = document.getElementById('hp-' + playerKey)
  const text   = document.getElementById('hptext-' + playerKey)

  fill.style.width = pct + '%'
  fill.style.background =
    pct > 50 ? '#1D9E75' :
    pct > 25 ? '#BA7517' : '#E24B4A'
  text.textContent = player.hp + ' / ' + player.maxHP
}

// ── Update turn indicators ────────────────────────────────────
function updateTurnIndicators() {
  ;['player1', 'player2'].forEach(key => {
    const card      = document.getElementById('card-' + key)
    const indicator = document.getElementById('turn-' + key)
    const isActive  = battleState.currentTurn === key

    card.classList.toggle('active-turn', isActive)
    indicator.classList.toggle('visible', isActive)
  })
}

// ── Flash card on damage ──────────────────────────────────────
function flashCard(playerKey, className) {
  const card = document.getElementById('card-' + playerKey)
  card.classList.add(className)
  setTimeout(() => card.classList.remove(className), 500)
}

// ── Add entry to event log ────────────────────────────────────
function addLog(message, type) {
  const log   = document.getElementById('eventLog')
  const entry = document.createElement('div')
  entry.className = 'log-entry ' + (type || '')
  entry.textContent = message
  log.appendChild(entry)
  // Auto-scroll to latest
  log.scrollTop = log.scrollHeight
}

// ── Reset everything ──────────────────────────────────────────
function resetAll() {
  battleState.currentTurn = 'player1'
  ;['player1','player2'].forEach(key => {
    battleState[key].hp          = 200
    battleState[key].maxHP       = 200
    battleState[key].streak      = 0
    battleState[key].critPending = false
    battleState[key].storedBonus = 0
  })

  document.getElementById('eventLog').innerHTML =
    '<div class="log-entry system">— Reset — Player 1\'s turn —</div>'

  updateAllDisplays()
}

// ── Init ──────────────────────────────────────────────────────
updateAllDisplays()
</script>
</body>
</html>
